version: '3.9'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crm-imob-api
    ports:
      - '4000:4000'
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: crm-imob-db
    environment:
      POSTGRES_DB: crm_imob
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d crm_imob']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
